name: SwiftUITelegram
options:
  bundleIdPrefix: com.swiftuitelegram
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    exactVersion: 1.5.2-tdlib-1.8.70-fe61d641
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    exactVersion: 4.6.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: ""
    TELEGRAM_API_ID: ""
    TELEGRAM_API_HASH: ""

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

targets:
  SwiftUITelegram:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/SwiftUITelegram
      - path: Resources/Assets.xcassets
    dependencies:
      - package: TDLibKit
        product: TDLibKit
      - package: Lottie
        product: Lottie
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: QuickLook.framework
      - sdk: QuickLookUI.framework
      - sdk: VideoToolbox.framework
      - sdk: WebKit.framework
      - sdk: libcompression.tbd
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: SwiftUITelegram
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "5"
        LSApplicationCategoryType: public.app-category.social-networking
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 SwiftUITelegram."
        NSPrincipalClass: NSApplication
        NSMicrophoneUsageDescription: "SwiftUITelegram 需要访问麦克风以录制并发送语音消息。"
        TELEGRAM_API_ID: "$(TELEGRAM_API_ID)"
        TELEGRAM_API_HASH: "$(TELEGRAM_API_HASH)"
    entitlements:
      path: Config/SwiftUITelegram.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftuitelegram.mac
        PRODUCT_NAME: SwiftUITelegram
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      environmentVariables:
        - variable: OS_ACTIVITY_MODE
          value: disable
          isEnabled: false
