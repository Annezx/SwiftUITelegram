name: macOS Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：将本次构建产物发布或补传到指定 Release tag（例如 v1.0.0）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: macos-15-intel
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare placeholder Secrets.xcconfig
        run: cp Config/Secrets.xcconfig.example Config/Secrets.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build SwiftUITelegram (Release, x86_64)
        run: |
          xcodebuild \
            -project SwiftUITelegram.xcodeproj \
            -scheme SwiftUITelegram \
            -configuration Release \
            -destination "platform=macOS,arch=x86_64" \
            -derivedDataPath build/DerivedData \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            ENABLE_HARDENED_RUNTIME=NO \
            build

      - name: Ad-hoc sign, verify, and package .app
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/SwiftUITelegram.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle not found at $APP_PATH"
            ls -la build/DerivedData/Build/Products/Release || true
            exit 1
          fi

          if [ -d "$APP_PATH/Contents/Frameworks" ]; then
            find "$APP_PATH/Contents/Frameworks" -maxdepth 2 \( -name "*.framework" -o -name "*.dylib" \) -print0 | \
              xargs -0 -I{} codesign --force --sign - "{}"
          fi
          codesign --force --sign - --entitlements Config/SwiftUITelegram.entitlements "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/SwiftUITelegram-macOS-x86_64.zip"
          ls -lh "dist/SwiftUITelegram-macOS-x86_64.zip"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/SwiftUITelegram-macOS-x86_64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${INPUT_RELEASE_TAG}"
          fi

          if [[ ! "${TAG}" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid release tag: ${TAG}"
            exit 1
          fi

          ASSET_NAME="SwiftUITelegram-${TAG}-macOS-x86_64.zip"
          cp "dist/SwiftUITelegram-macOS-x86_64.zip" "dist/${ASSET_NAME}"
          (
            cd dist
            shasum -a 256 "${ASSET_NAME}" > "SHA256SUMS.txt"
          )
          cat dist/SHA256SUMS.txt

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading assets with --clobber..."
            gh release upload "${TAG}" "dist/${ASSET_NAME}" "dist/SHA256SUMS.txt" --clobber
          else
            echo "Creating GitHub Release ${TAG}..."
            CREATE_ARGS=(
              "${TAG}"
              "dist/${ASSET_NAME}"
              "dist/SHA256SUMS.txt"
              --title "SwiftUITelegram ${TAG}"
              --generate-notes
            )
            if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
              CREATE_ARGS+=(--target "${GITHUB_SHA}")
            fi
            gh release create "${CREATE_ARGS[@]}"
          fi
