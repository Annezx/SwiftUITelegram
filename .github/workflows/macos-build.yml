name: macOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare placeholder Secrets.xcconfig
        run: cp Config/Secrets.xcconfig.example Config/Secrets.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build SwiftUITelegram (Debug, no signing)
        run: |
          xcodebuild \
            -project SwiftUITelegram.xcodeproj \
            -scheme SwiftUITelegram \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
